<style>
:root{--bg:#0e1320;--card:#171e2e;--ink:#e8edf5;--mut:#8a97ad;--acc:#2fd07f;--red:#ff6b6b;--org:#f0a04b;--blu:#4b9ff0;--line:#26304a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:19px} .upd{color:var(--mut);font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.teamsel{background:var(--card);padding:8px 12px;border-radius:10px;font-size:13px}
.teamsel select{margin-left:6px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--card);border-radius:10px;padding:8px 14px;min-width:104px}
.kpi span{display:block;color:var(--mut);font-size:11px} .kpi b{font-size:18px}
nav{display:flex;gap:4px;padding:10px 24px;flex-wrap:wrap;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
nav button{background:transparent;color:var(--mut);border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px}
nav button.active{background:var(--card);color:var(--ink);font-weight:600}
main{padding:20px 24px;max-width:1200px}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px}
h3{margin:0 0 12px;font-size:15px}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;color:var(--mut);font-weight:600;padding:7px 9px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--ink)}
td{padding:6px 9px;border-bottom:1px solid #202844;white-space:nowrap}
tr:hover td{background:#1c2438}
.pos{padding:1px 8px;border-radius:6px;font-size:11px;font-weight:600}
.neg{color:var(--red)} .posv{color:var(--acc)} .org{color:var(--org)} .mio{color:var(--acc);font-weight:700} .muted{color:var(--mut)}
.barcell{position:relative;min-width:96px}
.barcell span{position:absolute;left:0;top:1px;bottom:1px;background:rgba(47,208,127,.16);border-radius:4px}
.barcell i{position:relative;font-style:normal}
.tag{padding:1px 7px;border-radius:6px;font-size:11px;font-weight:600}
.t-sube,.t-solido{background:#2fd07f22;color:#2fd07f}.t-burbuja{background:#f0a04b22;color:#f0a04b}
.t-cae{background:#ff6b6b22;color:#ff6b6b}.t-plano{background:#26304a;color:#8a97ad}
.star{cursor:pointer;color:#3a4560;font-size:15px}.star.on{color:#f5c542}
input,select{background:#0e1320;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.btn{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px}
.diff{display:inline-block;min-width:34px;text-align:center;padding:2px 8px;border-radius:6px;font-weight:700}
.feeditem{padding:8px 10px;border-bottom:1px solid #202844;font-size:13px}
.pill{font-size:11px;padding:1px 7px;border-radius:6px;margin-right:8px}
.auth{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.auth input{width:150px;padding:7px 9px}.auth .btn{padding:7px 10px}.authmsg{color:var(--mut);max-width:250px}
</style></head>

async function loadPreferences(){
  if(!currentUser)return;
  const profile=await sb.from('perfiles').select('equipo_id,equipo_nombre').eq('user_id',currentUser.id).maybeSingle();
  if(profile.error){authMessage('Error cargando perfil: '+profile.error.message);return;}
  if(profile.data && D.equipos.some(e=>e.nombre===profile.data.equipo_nombre)){MY=profile.data.equipo_nombre;sel.value=MY;}
  else await saveProfile();
  const rows=await sb.from('seguimientos').select('jugador_id').eq('user_id',currentUser.id);
  if(rows.error){authMessage('Error cargando seguimiento: '+rows.error.message);return;}
  watch=new Set((rows.data||[]).map(r=>String(r.jugador_id)));
  LS.set('watch',[...watch]);LS.set('myTeam',MY);
}

async function saveProfile(){
  if(!currentUser)return;
  const result=await sb.from('perfiles').upsert({user_id:currentUser.id,equipo_id:MY,equipo_nombre:MY,actualizado:new Date().toISOString()});
  if(result.error)authMessage('Error guardando equipo: '+result.error.message);
}

async function toggleWatch(id){
  if(!currentUser){authMessage('Inicia sesión para guardar el seguimiento.');return false;}
  const jugadorId=String(id);
  if(watch.has(jugadorId)){
    const result=await sb.from('seguimientos').delete().eq('user_id',currentUser.id).eq('jugador_id',jugadorId);
    if(result.error){authMessage('Error quitando jugador: '+result.error.message);return false;}
    watch.delete(jugadorId);
  }else{
    const result=await sb.from('seguimientos').insert({user_id:currentUser.id,jugador_id:jugadorId});
    if(result.error){authMessage('Error guardando jugador: '+result.error.message);return false;}
    watch.add(jugadorId);
  }
  LS.set('watch',[...watch]);return true;
}

// comparativa por posicion (equipo elegido vs media rivales)
function comparativa(){
  const porPos=jug=>{const d={};D.posOrder.forEach(p=>d[p]=0);jug.forEach(j=>{if(d[j.pos]!=null)d[j.pos]+=j.valor});return d};
  const mio=porPos(myTeam().jugadores);
  const riv=D.equipos.filter(e=>e.nombre!==MY);
  const acc={};D.posOrder.forEach(p=>acc[p]=0);
  riv.forEach(e=>{const pp=porPos(e.jugadores);D.posOrder.forEach(p=>acc[p]+=pp[p])});
  const n=Math.max(riv.length,1);
  return {pos:D.posOrder,mio:D.posOrder.map(p=>+(mio[p]/1e6).toFixed(2)),
          rival:D.posOrder.map(p=>+(acc[p]/n/1e6).toFixed(2))};
}

function sortable(mount,rows,cols,sortKey,desc){
  const st={key:sortKey,desc:desc!==false};
  function draw(){
    const c=cols.find(x=>x.key===st.key)||cols[0];const sv=r=>c.sv?c.sv(r):r[c.key];
    const sorted=rows.slice().sort((a,b)=>{const va=sv(a),vb=sv(b);
      if(typeof va==='number'&&typeof vb==='number')return st.desc?vb-va:va-vb;
      return st.desc?(''+vb).localeCompare(''+va):(''+va).localeCompare(''+vb);});
    let h='<div class="tblwrap"><table><thead><tr>'+cols.map(x=>`<th data-k="${x.key}">${x.h}${st.key===x.key?(st.desc?' ▼':' ▲'):''}</th>`).join('')+'</tr></thead><tbody>';
    h+=sorted.map(r=>'<tr>'+cols.map(x=>`<td>${x.f(r)}</td>`).join('')+'</tr>').join('');
    mount.innerHTML=h+'</tbody></table></div>';
    mount.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(st.key===k)st.desc=!st.desc;else{st.key=k;st.desc=true;}draw();});
    wireStars();
  }draw();
}

function renderCal(m){
  m.innerHTML=`<div class="card"><h3>Dificultad del próximo rival de tus jugadores (${MY})</h3>
    <span class="muted">Índice Biwenger 0–100: más alto (verde) = rival más asequible. Cruce por nombre (posibles tocayos).</span><div id="mc" style="margin-top:12px"></div></div>
    <div class="card"><h3>Próxima jornada — todos los partidos</h3><div id="fx"></div></div>`;
  sortable(document.getElementById('mc'),miCalendario(),[
    {key:'nombre',h:'Jugador',f:r=>r.nombre},{key:'pos',h:'Pos',f:r=>posBadge(r.pos)},
    {key:'club',h:'Club',f:r=>r.club},{key:'rival',h:'Rival',f:r=>(r.casa===false?'@ ':'vs ')+r.rival},
    {key:'fecha',h:'Fecha',f:r=>r.fecha||'—'},
    {key:'rating',h:'Facilidad',sv:r=>r.rating||0,f:r=>diffCell(r.rating)}],'rating');
  sortable(document.getElementById('fx'),D.fixtures,[
    {key:'local',h:'Local',f:r=>r.local},{key:'ratLocal',h:'Fac. local',sv:r=>r.ratLocal||0,f:r=>diffCell(r.ratLocal)},
    {key:'visitante',h:'Visitante',f:r=>r.visitante},{key:'ratVis',h:'Fac. visit.',sv:r=>r.ratVis||0,f:r=>diffCell(r.ratVis)},
    {key:'fecha',h:'Fecha',f:r=>r.fecha||'—'}],'local',false);
}

function renderFeed(m){
  const col={fichaje:'#2fd07f22;color:#2fd07f',venta:'#f0a04b22;color:#f0a04b',salida:'#ff6b6b22;color:#ff6b6b',precio:'#4b9ff022;color:#4b9ff0',cambio:'#26304a;color:#8a97ad'};
  m.innerHTML='<div class="card"><h3>Histórico de movimientos</h3>'+
    '<div class="row"><label class="muted" for="feedFrom">Fecha desde</label><input id="feedFrom" type="date">'+
    '<label class="muted" for="feedTo">Fecha hasta</label><input id="feedTo" type="date"></div>'+
    '<div class="muted" id="feedCount"></div><div id="feedBody"></div></div>';
  const draw=()=>{
    const from=document.getElementById('feedFrom').value;
    const to=document.getElementById('feedTo').value;
    const rows=D.feed.filter(f=>(!from||f.fecha>=from)&&(!to||f.fecha<=to))
      .sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
    document.getElementById('feedCount').textContent=rows.length+' movimiento(s)';
    document.getElementById('feedBody').innerHTML=rows.length?rows.map(f=>`<div class="feeditem"><span class="muted">${f.fecha||'—'}</span> <span class="pill" style="background:${col[f.tipo]||col.cambio}">${f.tipo}</span>${f.txt}${f.precio?' · <b>'+EUR(f.precio)+'</b>':''}${bids(f)}</div>`).join(''):'<div class="muted" style="padding-top:10px">No hay movimientos en el intervalo seleccionado.</div>';
  };
  document.getElementById('feedFrom').onchange=draw;
  document.getElementById('feedTo').onchange=draw;
  draw();
}

function renderEquipos(m){
  const opts=D.equipos.map(e=>`<option ${e.nombre===MY?'selected':''}>${e.nombre}</option>`).join('');
  m.innerHTML=`<div class="row"><label class="muted">Equipo:</label><select id="selEq">${opts}</select></div><div id="eqHead"></div><div id="eqBody"></div>`;
  const draw=()=>{const e=D.equipos.find(x=>x.nombre===document.getElementById('selEq').value);
    document.getElementById('eqHead').innerHTML=`<div class="card"><h3>${e.nombre===MY?'★ ':''}${e.nombre}</h3>
      <span class="muted">Plantilla ${M(e.valor)} · Dinero ${M(e.dinero)} · ${e.pts} pts de liga · ${e.n} jug.</span></div>`;
    const maxV=Math.max(...e.jugadores.map(j=>j.valor));
    sortable(document.getElementById('eqBody'),e.jugadores,[
      {key:'nombre',h:'Jugador',f:r=>r.nombre},{key:'pos',h:'Pos',f:r=>posBadge(r.pos)},
      {key:'valor',h:'Valor',f:r=>bar(r.valor,maxV)},{key:'pts',h:'Puntos',f:r=>r.pts},
      {key:'venta',h:'En venta',f:r=>r.venta?`<span class="org">${M(r.venta)}</span>`:'—'}],'valor');
  };document.getElementById('selEq').onchange=draw;draw();
}

function renderVentas(m){
  if(!D.ventas.length){m.innerHTML='<div class="card muted">No hay jugadores disponibles en el mercado ahora.</div>';return;}
  const maxV=Math.max(...D.ventas.map(v=>v.venta));
  m.innerHTML=`<div class="card"><h3>Oportunidades — mercado actual (${D.ventas.length})</h3>
    <span class="muted">Ranking mixto: ${Math.round((1-D.pesoActual)*100)}% histórico 25/26 + ${Math.round(D.pesoActual*100)}% actual 26/27. “Pide” es el precio de compra.</span><div id="vt" style="margin-top:12px"></div></div>`;
  sortable(document.getElementById('vt'),D.ventas,[
    {key:'nombre',h:'Jugador',f:r=>r.nombre},{key:'pos',h:'Pos',f:r=>posBadge(r.pos)},
    {key:'dueno',h:'Vendedor',f:r=>`<span class="${r.dueno===MY?'mio':''}">${r.dueno}</span>`},
    {key:'valor',h:'Valor',f:r=>M(r.valor)},{key:'venta',h:'Pide',f:r=>bar(r.venta,maxV)},
    {key:'pta',h:'Pts25/26',f:r=>r.pta||'—'},{key:'pts',h:'Pts26/27',f:r=>r.pts||'—'},
    {key:'ratioMixto',h:'Pts/M€',f:r=>r.ratioMixto==null?'<span class="muted">—</span>':`<span class="posv">${r.ratioMixto}</span>`},
    {key:'ratioActual',h:'Actual/M€',f:r=>r.ratioActual==null?'<span class="muted">—</span>':r.ratioActual},
    {key:'hasta',h:'Hasta',f:r=>r.hasta||'—'},
    {key:'sobre',h:'Sobreprecio',f:r=>`<span class="${r.sobre>0?'neg':'posv'}">${r.sobre>0?'+':''}${(''+r.sobre).replace('.',',')}%</span>`}],'ratio');
}

let mkLimit=100;
function renderMercado(m){
  const posiciones=['','POR','DEF','MED','DEL'];const saved=LS.get('mkf')||{q:'',pos:''};
  m.innerHTML=`<div class="row"><input id="q" placeholder="Buscar jugador o equipo…" value="${saved.q||''}">
    <select id="pos">${posiciones.map(p=>`<option value="${p}" ${p===saved.pos?'selected':''}>${p||'Todas las posiciones'}</option>`).join('')}</select>
    <span class="muted" id="cnt"></span></div><div id="mkBody"></div>
    <div class="row" style="justify-content:center"><button class="btn" id="mas">Cargar más</button></div>`;
  const maxV=D.mercado.length?D.mercado[0].precio:1;
  const draw=()=>{const q=document.getElementById('q').value.toLowerCase();const pos=document.getElementById('pos').value;LS.set('mkf',{q,pos});
    let rows=D.mercado.filter(r=>(!pos||r.pos===pos)&&(r.nombre.toLowerCase().includes(q)||(r.equipo||'').toLowerCase().includes(q)));
    const total=rows.length;rows=rows.slice(0,mkLimit);
    document.getElementById('cnt').textContent=rows.length+' de '+total;
    document.getElementById('mas').style.display=rows.length<total?'block':'none';
    sortable(document.getElementById('mkBody'),rows,[
      {key:'star',h:'★',sv:r=>watch.has(r.id)?1:0,f:r=>star(r.id)},
      {key:'nombre',h:'Jugador',f:r=>r.nombre},{key:'equipo',h:'Equipo',f:r=>r.equipo},
      {key:'pos',h:'Pos',f:r=>posBadge(r.pos)},{key:'precio',h:'Precio',f:r=>bar(r.precio,maxV)},
      {key:'serie',h:'Tend.',sv:r=>0,f:r=>sparkSVG(r.id)},
      {key:'var',h:'Var.',f:r=>varCell(r.var)},{key:'tag',h:'Señal',f:r=>tagCell(r)},
      {key:'pta',h:'Pts25',f:r=>r.pta},{key:'estado',h:'Estado',f:r=>estadoCell(r.estado)}],'precio');
  };
  document.getElementById('q').oninput=()=>{mkLimit=100;draw()};
  document.getElementById('pos').onchange=()=>{mkLimit=100;draw()};
  document.getElementById('mas').onclick=()=>{mkLimit+=100;draw()};draw();
}

  sortable(document.getElementById('ct'),D.chollos,[

    {key:'pos',h:'Pos',f:r=>posBadge(r.pos)},{key:'precio',h:'Precio',f:r=>M(r.precio)},
    {key:'pta',h:'Pts25/26',f:r=>r.pta},{key:'pts',h:'Pts26/27',f:r=>r.pts},
    {key:'ratioMixto',h:'Pts/M€',f:r=>r.ratioMixto},{key:'ratioActual',h:'Actual/M€',f:r=>r.ratioActual},

function renderRiesgos(m){
  m.innerHTML='<div class="card"><h3>Lesionados / dudas / sancionados ('+D.riesgos.length+')</h3><div id="rt"></div></div>';
  sortable(document.getElementById('rt'),D.riesgos,[
    {key:'nombre',h:'Jugador',f:r=>r.nombre},{key:'equipo',h:'Equipo',f:r=>r.equipo},
    {key:'pos',h:'Pos',f:r=>posBadge(r.pos)},{key:'precio',h:'Precio',f:r=>M(r.precio)},
    {key:'estado',h:'Estado',f:r=>estadoCell(r.estado)},{key:'info',h:'Detalle',f:r=>r.info||'—'}],'precio');

function renderWatch(m){
  const rows=D.mercado.filter(r=>watch.has(r.id));
  if(!rows.length){m.innerHTML='<div class="card muted">Sin jugadores en seguimiento. Pulsa la ★ en Mercado o Chollos.</div>';return;}
  const maxV=Math.max(...rows.map(r=>r.precio));
  m.innerHTML='<div class="card"><h3>Mi seguimiento ('+rows.length+')</h3><div id="wt"></div></div>';
  sortable(document.getElementById('wt'),rows,[
    {key:'star',h:'★',sv:r=>1,f:r=>star(r.id)},
    {key:'nombre',h:'Jugador',f:r=>r.nombre},{key:'equipo',h:'Equipo',f:r=>r.equipo},
    {key:'pos',h:'Pos',f:r=>posBadge(r.pos)},{key:'precio',h:'Precio',f:r=>bar(r.precio,maxV)},
    {key:'serie',h:'Tend.',sv:r=>0,f:r=>sparkSVG(r.id)},{key:'var',h:'Var.',f:r=>varCell(r.var)},{key:'tag',h:'Señal',f:r=>tagCell(r)}],'precio');
}

async function initApp(){
  renderAuth();drawKpis();render();
  const session=await sb.auth.getSession();
  currentUser=session.data.session?.user||null;
  renderAuth();
  await loadPreferences();
  drawKpis();render();
  sb.auth.onAuthStateChange(async(_event,session)=>{
    currentUser=session?.user||null;renderAuth();
    if(currentUser){await loadPreferences();drawKpis();render();}
  });
}
initApp();
</script>
